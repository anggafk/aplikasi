<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Praktikum</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sauber-blue': '#002D72',
                        'petronas-cyan': '#00A19C',
                        'speed-white': '#FDFDFD',
                        'red-bull-red': '#E10600'
                    },
                    fontFamily: {
                        'bebas': ['"Bebas Neue"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, dan Babel CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

    <!-- Google Fonts: Plus Jakarta Sans dan Bebas Neue -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#FDFDFD]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Wrapper localStorage aman (tidak error jika storage diblokir, mis. di preview)
        const safeStore = {
            get: (k) => { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
            set: (k, v) => { try { window.localStorage.setItem(k, v); } catch (e) {} },
            remove: (k) => { try { window.localStorage.removeItem(k); } catch (e) {} }
        };

        const safeParse = (v) => { try { return JSON.parse(v); } catch (e) { return null; } };

        const MAX_STUDENTS = 6;
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

        // Custom Router Icon (Gaya Cisco Sirkular dengan tanda panah keluar)
        const RouterIcon = ({ className }) => (
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2.5"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3v18M3 12h18" />
                <path d="M12 3.5l2 2m-2-2l-2 2" />
                <path d="M12 20.5l2-2m-2 2l-2-2" />
                <path d="M3.5 12l2-2m-2 2l2 2" />
                <path d="M20.5 12l-2-2m2 2l-2 2" />
            </svg>
        );

        // Komponen Ikon Inline
        const Play = ({ className, size = 18 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
            </svg>
        );

        const Pause = ({ className, size = 18 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="4" width="4" height="16" fill="currentColor"/>
                <rect x="14" y="4" width="4" height="16" fill="currentColor"/>
            </svg>
        );

        const X = ({ className, size = 24 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        );

        const Settings = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        );

        const Square = ({ className, size = 18 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            </svg>
        );

        const Users = ({ className, size = 20 }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        );

        const App = () => {
            // Status jalan global (survive dari mati listrik via localStorage)
            const [isRunning, setIsRunning] = useState(() => {
                const saved = safeStore.get('kk_tkj_isRunning_v2');
                return saved === 'true';
            });

            // Waktu berjalan spesifik tiap kelompok (elapsed seconds)
            const [groupTimes, setGroupTimes] = useState(() => {
                const saved = safeStore.get('kk_tkj_groupTimes_v2');
                return (saved && safeParse(saved)) || [0, 0, 0];
            });

            // Status keaktifan individu masing-masing kelompok
            const [groupIsRunning, setGroupIsRunning] = useState(() => {
                const saved = safeStore.get('kk_tkj_groupIsRunning_v2');
                return (saved && safeParse(saved)) || [true, true, true];
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);

            // Panel yang terbuka di tiap kelompok: input nama siswa
            const [openOverlays, setOpenOverlays] = useState([false, false, false]);

            // Nama kelompok
            const [rawTitles, setRawTitles] = useState(() => {
                const saved = safeStore.get('kk_tkj_rawTitles');
                return saved || "KELOMPOK 1\nKELOMPOK 2\nKELOMPOK 3";
            });

            // Penjaga stabilitas waktu saat tab tidak aktif
            const lastTimeRef = useRef(Date.now());

            // Input nama siswa (maksimal 6 siswa per kelompok)
            const [group1NamesInput, setGroup1NamesInput] = useState(() => {
                const saved = safeStore.get('kk_tkj_group1NamesInput6');
                return saved || "Siswa A1\nSiswa A2\nSiswa A3\nSiswa A4\nSiswa A5\nSiswa A6";
            });
            const [group2NamesInput, setGroup2NamesInput] = useState(() => {
                const saved = safeStore.get('kk_tkj_group2NamesInput6');
                return saved || "Siswa B1\nSiswa B2\nSiswa B3\nSiswa B4\nSiswa B5\nSiswa B6";
            });
            const [group3NamesInput, setGroup3NamesInput] = useState(() => {
                const saved = safeStore.get('kk_tkj_group3NamesInput6');
                return saved || "Siswa C1\nSiswa C2\nSiswa C3\nSiswa C4\nSiswa C5\nSiswa C6";
            });

            // Hasil urutan acak siswa A-F per kelompok
            const [shuffledLists, setShuffledLists] = useState(() => {
                const saved = safeStore.get('kk_tkj_shuffledLists6');
                return (saved && safeParse(saved)) || [
                    ["Siswa A1", "Siswa A2", "Siswa A3", "Siswa A4", "Siswa A5", "Siswa A6"],
                    ["Siswa B1", "Siswa B2", "Siswa B3", "Siswa B4", "Siswa B5", "Siswa B6"],
                    ["Siswa C1", "Siswa C2", "Siswa C3", "Siswa C4", "Siswa C5", "Siswa C6"]
                ];
            });

            const [shufflingGroups, setShufflingGroups] = useState([false, false, false]);

            // Judul aplikasi (bisa diedit lewat pengaturan)
            const [appTitle, setAppTitle] = useState(() => {
                const saved = safeStore.get('kk_tkj_appTitle');
                return saved !== null && saved !== undefined ? saved : "PROJEK KK TKJ";
            });

            // Durasi total ujian (menit) - bisa diatur lewat tombol pengaturan
            const [durationInput, setDurationInput] = useState(() => {
                const saved = safeStore.get('kk_tkj_durationMin');
                return saved || "165";
            });
            const parsedDuration = parseInt(durationInput, 10);
            const totalSeconds = (parsedDuration > 0 ? parsedDuration : 165) * 60;

            // --- PERSISTENSI LOCALSTORAGE ---
            useEffect(() => {
                safeStore.set('kk_tkj_groupTimes_v2', JSON.stringify(groupTimes));
            }, [groupTimes]);

            useEffect(() => {
                safeStore.set('kk_tkj_groupIsRunning_v2', JSON.stringify(groupIsRunning));
            }, [groupIsRunning]);

            useEffect(() => {
                safeStore.set('kk_tkj_isRunning_v2', isRunning.toString());
            }, [isRunning]);

            useEffect(() => {
                safeStore.set('kk_tkj_rawTitles', rawTitles);
            }, [rawTitles]);

            useEffect(() => {
                safeStore.set('kk_tkj_group1NamesInput6', group1NamesInput);
                safeStore.set('kk_tkj_group2NamesInput6', group2NamesInput);
                safeStore.set('kk_tkj_group3NamesInput6', group3NamesInput);
            }, [group1NamesInput, group2NamesInput, group3NamesInput]);

            useEffect(() => {
                safeStore.set('kk_tkj_shuffledLists6', JSON.stringify(shuffledLists));
            }, [shuffledLists]);

            useEffect(() => {
                safeStore.set('kk_tkj_appTitle', appTitle);
                document.title = appTitle.trim() || 'Timer Praktikum';
            }, [appTitle]);

            useEffect(() => {
                safeStore.set('kk_tkj_durationMin', durationInput);
            }, [durationInput]);

            const getTitles = () => {
                const lines = rawTitles.split(/\r?\n/);
                return [
                    lines[0] || 'KELOMPOK 1',
                    lines[1] || 'KELOMPOK 2',
                    lines[2] || 'KELOMPOK 3'
                ];
            };

            const titles = getTitles();

            // Interval Timer Utama (akurat, survive tab inactivity) - tiap kelompok punya waktu sendiri
            useEffect(() => {
                let interval = null;

                if (isRunning) {
                    lastTimeRef.current = Date.now();

                    const tick = () => {
                        const now = Date.now();
                        const deltaMs = now - lastTimeRef.current;
                        if (deltaMs >= 1000) {
                            const secondsPassed = Math.floor(deltaMs / 1000);
                            lastTimeRef.current = lastTimeRef.current + (secondsPassed * 1000);

                            setGroupTimes(prevTimes =>
                                prevTimes.map((t, idx) =>
                                    (groupIsRunning[idx] && t < totalSeconds)
                                        ? Math.min(totalSeconds, t + secondsPassed)
                                        : t
                                )
                            );
                        }
                    };

                    tick();
                    interval = setInterval(tick, 100);

                    // Sinkronisasi saat tab dibuka kembali
                    const handleTabActive = () => {
                        if (document.visibilityState === 'visible') {
                            tick();
                        }
                    };

                    document.addEventListener('visibilitychange', handleTabActive);
                    window.addEventListener('focus', handleTabActive);

                    return () => {
                        clearInterval(interval);
                        document.removeEventListener('visibilitychange', handleTabActive);
                        window.removeEventListener('focus', handleTabActive);
                    };
                }
            }, [isRunning, groupIsRunning, totalSeconds]);

            const toggleTimer = () => setIsRunning(!isRunning);

            const handleStopAndReset = () => {
                setIsResetConfirmOpen(true);
            };

            // Reset timer (daftar nama dan hasil acak tetap dipertahankan)
            const executeReset = () => {
                setIsResetConfirmOpen(false);
                setIsRunning(false);
                setGroupTimes([0, 0, 0]);
                setGroupIsRunning([true, true, true]);

                safeStore.remove('kk_tkj_groupTimes_v2');
                safeStore.remove('kk_tkj_groupIsRunning_v2');
                safeStore.remove('kk_tkj_isRunning_v2');
            };

            // Klik 1X waktu kelompok untuk pause, klik 1X lagi untuk resume
            const handleGroupTimerClick = (sIdx) => {
                if (!isRunning) return;

                setGroupIsRunning(prev => {
                    const next = [...prev];
                    next[sIdx] = !next[sIdx];
                    return next;
                });
            };

            // Format waktu Menit:Detik
            const formatTime = (seconds) => {
                if (seconds === null) return "--:--";
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleInputChange = (sIdx, value) => {
                if (sIdx === 0) setGroup1NamesInput(value);
                else if (sIdx === 1) setGroup2NamesInput(value);
                else if (sIdx === 2) setGroup3NamesInput(value);
            };

            // Generator urutan acak 6 siswa (mode normal: sisa slot '---', mode ganda: sisa slot diisi nama acak)
            const generateShuffledList = (names, mode) => {
                if (names.length === 0) return Array(MAX_STUDENTS).fill("---");

                const shuffle = (arr) => {
                    const temp = [...arr];
                    for (let i = temp.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [temp[i], temp[j]] = [temp[j], temp[i]];
                    }
                    return temp;
                };

                const base = shuffle(names.slice(0, MAX_STUDENTS));

                if (mode === 'duplicate') {
                    while (base.length < MAX_STUDENTS) {
                        base.push(names[Math.floor(Math.random() * names.length)]);
                    }
                } else {
                    while (base.length < MAX_STUDENTS) {
                        base.push("---");
                    }
                }
                return base;
            };

            // Animasi pengacakan
            const handleShuffle = (groupIdx, inputString, mode = 'normal') => {
                if (shufflingGroups[groupIdx]) return;

                setShufflingGroups(prev => {
                    const next = [...prev];
                    next[groupIdx] = true;
                    return next;
                });

                const lines = inputString.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
                const actualNames = lines.slice(0, MAX_STUDENTS);

                const applyShuffle = () => {
                    setShuffledLists(prev => prev.map((list, idx) =>
                        idx === groupIdx ? generateShuffledList(actualNames, mode) : list
                    ));
                };

                let ticks = 0;
                const maxTicks = 15; // sekitar 3 detik (200ms per tick)

                const interval = setInterval(() => {
                    applyShuffle();
                    ticks++;
                    if (ticks >= maxTicks) {
                        clearInterval(interval);
                        applyShuffle();
                        setShufflingGroups(prev => {
                            const next = [...prev];
                            next[groupIdx] = false;
                            return next;
                        });
                    }
                }, 200);
            };

            // Simpan daftar nama sesuai urutan input (tanpa diacak), lalu tutup panel
            const handleSaveNames = (groupIdx, inputString) => {
                const names = inputString.split(/\r?\n/).map(n => n.trim()).filter(Boolean).slice(0, MAX_STUDENTS);
                while (names.length < MAX_STUDENTS) names.push("---");
                setShuffledLists(prev => prev.map((list, idx) => idx === groupIdx ? names : list));
                setOverlay(groupIdx, false);
            };

            const setOverlay = (sIdx, value) => {
                const next = [...openOverlays];
                next[sIdx] = value;
                setOpenOverlays(next);
            };

            const getInputs = [group1NamesInput, group2NamesInput, group3NamesInput];

            return (
                <div className="min-h-screen bg-[#FDFDFD] font-sans text-[#002D72]">

                    {/* MODAL KONFIRMASI RESET (STOP) */}
                    {isResetConfirmOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#002D72]/80 backdrop-blur-md" onClick={() => setIsResetConfirmOpen(false)}></div>
                            <div className="relative bg-[#FDFDFD] w-full max-w-md rounded-none border-t-8 border-[#E10600] shadow-[0_0_50px_rgba(0,0,0,0.3)] p-6 text-left">
                                <div className="flex items-center gap-3 text-[#E10600] mb-4">
                                    <Square size={24} className="fill-[#E10600] text-[#E10600]" />
                                    <h2 className="font-black text-lg uppercase tracking-wider">KONFIRMASI RESET</h2>
                                </div>
                                <p className="text-sm font-bold text-[#002D72] mb-6">
                                    Apakah Anda yakin ingin menghentikan ujian global dan mereset timer semua kelompok? Tindakan ini tidak dapat dibatalkan.
                                </p>
                                <div className="flex gap-3 justify-end">
                                    <button
                                        onClick={() => setIsResetConfirmOpen(false)}
                                        className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-[#002D72] font-black text-xs uppercase tracking-wider transition-all rounded border-2 border-slate-200"
                                    >
                                        BATAL
                                    </button>
                                    <button
                                        onClick={executeReset}
                                        className="px-5 py-2.5 bg-[#E10600] hover:bg-[#b00500] text-white font-black text-xs uppercase tracking-wider transition-all rounded"
                                    >
                                        YA, RESET SEMUA
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Konfigurasi Nama Kelompok */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#002D72]/80 backdrop-blur-md" onClick={() => setIsModalOpen(false)}></div>
                            <div className="relative bg-[#FDFDFD] w-full max-w-lg rounded-none border-t-8 border-[#00A19C] shadow-[0_0_50px_rgba(0,0,0,0.3)] overflow-hidden flex flex-col text-left text-[#002D72]">
                                <div className="bg-[#002D72] p-5 flex justify-between items-center text-[#FDFDFD]">
                                    <div className="flex items-center gap-3">
                                        <Settings size={20} className="text-[#00A19C]" />
                                        <h2 className="font-black text-sm uppercase tracking-[0.2em]">SISTEM KONFIGURASI</h2>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="hover:text-[#E10600] transition-colors"><X size={24} /></button>
                                </div>
                                <div className="p-6 overflow-y-auto max-h-[70vh]">
                                    <label className="block text-[10px] font-black text-[#002D72]/40 uppercase tracking-widest mb-2">JUDUL APLIKASI</label>
                                    <input
                                        type="text"
                                        className="w-full bg-[#f1f5f9] border-l-4 border-[#002D72] p-3 text-sm font-black uppercase focus:ring-0 focus:border-[#00A19C] outline-none shadow-inner text-[#002D72] mb-6"
                                        value={appTitle}
                                        onChange={(e) => setAppTitle(e.target.value)}
                                        placeholder="PROJEK KK TKJ"
                                    />

                                    <label className="block text-[10px] font-black text-[#002D72]/40 uppercase tracking-widest mb-2">IDENTITAS KELOMPOK (3 BARIS)</label>
                                    <textarea
                                        className="w-full bg-[#f1f5f9] border-l-4 border-[#002D72] p-4 text-sm font-bold focus:ring-0 focus:border-[#00A19C] outline-none h-24 shadow-inner text-[#002D72]"
                                        value={rawTitles}
                                        onChange={(e) => setRawTitles(e.target.value)}
                                    />

                                    <label className="block text-[10px] font-black text-[#002D72]/40 uppercase tracking-widest mb-2 mt-6">DURASI WAKTU (MENIT)</label>
                                    <div className="flex items-center gap-3">
                                        <input
                                            type="number"
                                            min="1"
                                            max="999"
                                            className="w-32 bg-[#f1f5f9] border-l-4 border-[#002D72] p-3 text-lg font-black focus:ring-0 focus:border-[#00A19C] outline-none shadow-inner text-[#002D72]"
                                            value={durationInput}
                                            onChange={(e) => setDurationInput(e.target.value)}
                                        />
                                        <span className="text-xs font-bold text-[#002D72]/60">menit (berlaku untuk semua kelompok)</span>
                                    </div>
                                    <div className="flex gap-2 mt-3 flex-wrap">
                                        {[30, 60, 90, 120, 165].map(m => (
                                            <button
                                                key={m}
                                                onClick={() => setDurationInput(String(m))}
                                                className="px-3 py-1.5 border-2 border-[#002D72]/20 hover:border-[#00A19C] hover:text-[#00A19C] text-[#002D72] font-black text-xs rounded transition-all"
                                            >
                                                {m}
                                            </button>
                                        ))}
                                    </div>

                                    <button
                                        onClick={() => setIsModalOpen(false)}
                                        className="w-full mt-6 bg-[#00A19C] hover:bg-[#002D72] text-[#FDFDFD] font-black py-4 uppercase tracking-[0.2em] transition-all active:scale-[0.98] shadow-lg"
                                    >
                                        UPDATE DATA SISTEM
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header Utama */}
                    <header className="bg-[#002D72] text-[#FDFDFD] py-4 px-6 sticky top-0 z-40 border-b-4 border-[#00A19C] shadow-2xl">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-6">
                            <div className="flex items-center gap-4">
                                <div className="bg-[#00A19C] p-2 skew-x-[-12deg]">
                                    <RouterIcon className="text-[#FDFDFD] w-7 h-7 skew-x-[12deg]" />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black italic tracking-tighter leading-none text-nowrap">{appTitle.trim() || "PROJEK KK TKJ"}</h1>
                                </div>
                            </div>

                            <div className="flex items-center gap-6">
                                 <div className="flex gap-2">
                                    <button
                                        onClick={toggleTimer}
                                        className="px-6 py-3 bg-[#00A19C] text-[#FDFDFD] font-black uppercase tracking-widest text-xs flex items-center gap-2 transition-all hover:opacity-90 active:scale-95 shadow-sm"
                                        title={isRunning ? "Pause" : "Start"}
                                    >
                                        {isRunning ? <Pause size={18} /> : <Play size={18} />}
                                        {isRunning ? 'PAUSE' : 'START'}
                                    </button>

                                    <button
                                        onClick={handleStopAndReset}
                                        className="px-6 py-3 bg-[#E10600] text-[#FDFDFD] font-black uppercase tracking-widest text-xs flex items-center gap-2 transition-all hover:bg-[#b00500] active:scale-95 shadow-sm"
                                        title="Stop & Reset All"
                                    >
                                        <Square size={18} />
                                        STOP
                                    </button>
                                 </div>
                            </div>

                            <div className="flex gap-2">
                                <button
                                    onClick={() => setIsModalOpen(true)}
                                    className="p-3 border-2 border-[#00A19C] text-[#00A19C] hover:bg-[#00A19C] hover:text-[#FDFDFD] transition-all flex items-center justify-center group shadow-sm"
                                    title="Konfigurasi Kelompok"
                                >
                                    <Settings size={20} className="group-hover:rotate-90 transition-transform duration-500" />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Grid List Kelompok */}
                    <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8">
                        {[0, 1, 2].map((sIdx) => {
                            const groupTime = groupTimes[sIdx];
                            const isGroupFinished = !groupIsRunning[sIdx] && groupTime > 0;
                            const cardBg = isGroupFinished ? 'bg-[#00A19C]' : 'bg-[#FDFDFD]';

                            return (
                                <div
                                    key={sIdx}
                                    className={`relative overflow-hidden ${cardBg} border-t-8 transition-all duration-300 flex flex-col shadow-xl h-full border-slate-200`}
                                    style={{
                                        borderTopColor: isGroupFinished ? '#002D72' : (isRunning && groupIsRunning[sIdx]) ? '#002D72' : '#e2e8f0'
                                    }}
                                >
                                    {/* PANEL INPUT NAMA SISWA (Overlay) */}
                                    {openOverlays[sIdx] && (
                                        <div className="absolute inset-0 bg-[#FDFDFD] z-30 flex flex-col p-4 border-t-8 border-[#00A19C] overflow-hidden">
                                            <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100 shrink-0">
                                                <div className="flex items-center gap-2 text-[#002D72]">
                                                    <Users size={18} className="text-[#00A19C]" />
                                                    <span className="font-black text-xs uppercase tracking-wider">{titles[sIdx]} - ANGGOTA</span>
                                                </div>
                                                <button
                                                    onClick={() => setOverlay(sIdx, false)}
                                                    className="text-slate-400 hover:text-[#E10600] transition-colors"
                                                    title="Tutup"
                                                >
                                                    <X size={20} />
                                                </button>
                                            </div>

                                            <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 text-left shrink-0">
                                                Daftar Nama (1 baris = 1 nama, maks. 6)
                                            </label>
                                            <textarea
                                                className="flex-1 min-h-0 bg-white border border-slate-300 px-3 py-2 text-sm font-bold focus:ring-0 focus:border-[#00A19C] outline-none text-[#002D72] resize-none rounded shadow-inner"
                                                value={getInputs[sIdx]}
                                                onChange={(e) => handleInputChange(sIdx, e.target.value)}
                                                placeholder="Masukkan nama siswa..."
                                            />

                                            <div className="grid grid-cols-2 gap-2 mt-3 shrink-0">
                                                <button
                                                    onClick={() => { handleShuffle(sIdx, getInputs[sIdx], 'normal'); setOverlay(sIdx, false); }}
                                                    disabled={shufflingGroups[sIdx]}
                                                    className="bg-[#00A19C] hover:bg-[#002D72] text-[#FDFDFD] font-black py-3 text-[11px] uppercase tracking-wider transition-all rounded shadow-sm"
                                                    title="Jika siswa kurang dari 6, sisa slot dikosongkan"
                                                >
                                                    ACAK BIASA
                                                </button>
                                                <button
                                                    onClick={() => { handleShuffle(sIdx, getInputs[sIdx], 'duplicate'); setOverlay(sIdx, false); }}
                                                    disabled={shufflingGroups[sIdx]}
                                                    className="bg-[#002D72] hover:bg-[#00A19C] text-[#FDFDFD] font-black py-3 text-[11px] uppercase tracking-wider transition-all rounded shadow-sm"
                                                    title="Jika siswa kurang dari 6, sisa slot diisi nama ganda"
                                                >
                                                    ACAK GANDA
                                                </button>
                                            </div>

                                            <button
                                                onClick={() => handleSaveNames(sIdx, getInputs[sIdx])}
                                                className="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-[#002D72] font-black py-2.5 text-xs uppercase tracking-wider transition-all rounded shrink-0 border-2 border-slate-200"
                                            >
                                                SIMPAN &amp; TUTUP
                                            </button>
                                        </div>
                                    )}

                                    {/* Area Display Besar Kelompok - klik 1x untuk pause / resume */}
                                    <button
                                        onClick={() => handleGroupTimerClick(sIdx)}
                                        className={`p-6 border-b-2 text-center transition-all min-h-[220px] flex flex-col justify-center items-center w-full focus:outline-none cursor-pointer group/timer ${
                                            isGroupFinished ? 'bg-[#00A19C] border-[#00A19C]' : 'bg-[#f8fafc] border-[#002D72]/10'
                                        }`}
                                    >
                                         <h3 className={`text-[16px] font-black uppercase tracking-[0.4em] mb-4 transition-colors ${
                                             isGroupFinished ? 'text-white' : 'text-[#002D72]/40 group-hover/timer:text-[#00A19C]'
                                         }`}>
                                             {titles[sIdx]}
                                         </h3>

                                         <div className={`text-[110px] font-bebas font-black tracking-wider leading-none transition-colors group-hover/timer:scale-105 duration-200 transform ${
                                             isGroupFinished ? 'text-white' : (isRunning && groupIsRunning[sIdx]) ? 'text-[#002D72]' : 'text-slate-200'
                                         }`}>
                                             {formatTime(Math.max(0, totalSeconds - groupTime))}
                                         </div>


                                    </button>

                                    {/* Urutan Acak Siswa A - F (menggantikan daftar tugas & timer tugas) */}
                                    <div className={`p-5 flex-1 space-y-2 ${cardBg}`}>
                                        {LETTERS.map((letter, letterIdx) => (
                                            <div
                                                key={letter}
                                                className={`flex items-center gap-3 pl-2.5 pr-2 border-2 rounded h-[52px] transition-all ${
                                                    'border-slate-100 bg-white'
                                                } ${shufflingGroups[sIdx] ? 'blur-[1px] opacity-70 animate-pulse' : ''}`}
                                            >
                                                <div className={`w-8 h-8 flex items-center justify-center shrink-0 rounded font-black font-bebas text-xl ${
                                                    isGroupFinished ? 'bg-[#00A19C] text-[#FDFDFD]' : 'bg-[#002D72] text-[#FDFDFD]'
                                                }`}>
                                                    {letter}
                                                </div>
                                                <span className={`text-[16px] font-black uppercase tracking-wider truncate ${
                                                    isGroupFinished ? 'text-[#00A19C]' : 'text-[#002D72]'
                                                }`}>
                                                    {shuffledLists[sIdx][letterIdx] || "---"}
                                                </span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Tombol Aksi di Bagian Bawah Tiap Kelompok */}
                                    <div className={`px-5 pb-5 pt-2 ${cardBg} shrink-0`}>
                                        <button
                                            onClick={() => setOverlay(sIdx, true)}
                                            className={`w-full py-2.5 border-2 border-dashed transition-all font-black text-[11px] uppercase tracking-wider flex items-center justify-center gap-1.5 rounded ${isGroupFinished ? 'bg-white border-[#00A19C] text-[#00A19C] hover:bg-white hover:text-[#00A19C]' : 'border-[#002D72] text-[#002D72] hover:bg-[#002D72] hover:text-[#FDFDFD]'}`}
                                        >
                                            <Users size={14} />
                                            ATUR &amp; ACAK
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </main>
                </div>
            );
        };

        // Render Komponen Utama
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
